name: Simulated Operator Diagnostic

"on":
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  simulated-operator-diagnostic:
    name: Simulated Operator Diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Verify Repository
        run: |
          bun run typecheck
          bun run src/scripts/quality-gate.ts

      - name: Produce and Verify Diagnostic Evidence
        shell: bash
        env:
          SKILL_BENCHMARKS_USE_MOCK: "true"
        run: |
          set -euo pipefail
          bundle="${{ runner.temp }}/skill-benchmarks-simulated-diagnostic"
          runtime="$bundle/runtime"
          test ! -e "$runtime"
          mkdir -p "$bundle/logs"
          env -u ANTHROPIC_API_KEY -u OPENAI_API_KEY -u GEMINI_API_KEY -u GOOGLE_API_KEY \
            bun bin/skill-benchmarks run \
              --mock \
              --scenario git-worktrees \
              --skill tdd \
              --model gpt-4o \
              --output-dir "$runtime" 2>&1 | tee "$bundle/logs/run.log"
          bun bin/skill-benchmarks report \
            --db "$runtime/db/benchmarks.sqlite" \
            --format json \
            --output "$runtime/exports/diagnostic-report.json"
          bun run verify:ci-diagnostic -- "$bundle"

      - name: Upload Verified Diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: simulated-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/skill-benchmarks-simulated-diagnostic
          if-no-files-found: error
          retention-days: 7
