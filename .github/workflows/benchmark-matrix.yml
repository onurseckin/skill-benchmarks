name: Benchmark Matrix Sweep

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  benchmark-matrix:
    name: Sweep / ${{ matrix.category }} / ${{ matrix.model }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        category:
          - coding
          - reasoning
          - tool-use
        model:
          - gpt-4o
          - claude-3-5-sonnet
          - gemini-1.5-pro

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Baseline Benchmark Sweep
        run: |
          bun run src/cli/index.ts sweep \
            --category ${{ matrix.category }} \
            --model ${{ matrix.model }} \
            --output-db ./results/baseline.sqlite \
            --ref ${{ github.event.pull_request.base.sha || 'origin/main' }}

      - name: Run Candidate Benchmark Sweep
        run: |
          bun run src/cli/index.ts sweep \
            --category ${{ matrix.category }} \
            --model ${{ matrix.model }} \
            --output-db ./results/candidate.sqlite

      - name: Upload Matrix Artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.category }}-${{ matrix.model }}
          path: ./results/*.sqlite
          retention-days: 7

  regression-gate-and-comment:
    name: Regression Analysis & PR Leaderboard Bot
    needs: benchmark-matrix
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Download All Benchmark Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all-results

      - name: Run Quality Gate and Typecheck
        run: |
          bun run typecheck
          bun src/scripts/quality-gate.ts

      - name: Detect Regressions and Post PR Leaderboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          bun -e '
            import { RegressionDetector } from "./src/ci/regression-detector.js";
            import { GitHubCommentClient, generatePrLeaderboardMarkdown } from "./src/ci/pr-commenter.js";

            const detector = new RegressionDetector();
            const summary = detector.evaluate({
              baselineRuns: [],
              candidateRuns: [],
            });

            if (process.env.PR_NUMBER && process.env.GITHUB_TOKEN) {
              const client = new GitHubCommentClient({
                owner: process.env.REPO_OWNER || "",
                repo: process.env.REPO_NAME || "",
                prNumber: parseInt(process.env.PR_NUMBER, 10),
                token: process.env.GITHUB_TOKEN,
              });

              const markdown = generatePrLeaderboardMarkdown(summary, {
                commitSha: process.env.COMMIT_SHA || "",
                repoOwner: process.env.REPO_OWNER,
                repoName: process.env.REPO_NAME,
                includeScenarioBreakdown: true,
              });

              await client.postOrUpdateComment(markdown);
            }

            if (summary.verdict === "FAIL") {
              console.error("Benchmark Regression Gate FAILED");
              process.exit(1);
            }
          '
